name: Build and software tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native executable
        run: make all build/DS720DScanner-universal build/DS720DICA-universal build/DS720DUSBService-universal build/DS720DDoctor-universal
      - name: Test transport, duplex decoding and document rendering
        run: make test
      - name: Analyze native source
        run: make analyze
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install public development dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libusb-1.0-0-dev libpng-dev libsane-dev sane-utils
      - name: Build and test Linux engine and SANE lifecycle
        run: make -C linux all test
      - name: Build architecture-specific Debian package
        run: ./packaging/linux/build-deb.sh
      - name: Verify installed SANE loader without a scanner
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          mkdir -p /tmp/ds720d-sane-config
          printf 'ds720d\n' > /tmp/ds720d-sane-config/dll.conf
          SANE_CONFIG_DIR=/tmp/ds720d-sane-config SANE_DEBUG_DLL=5 scanimage -L > /tmp/ds720d-loader.log 2>&1
          cat /tmp/ds720d-loader.log
          grep -F "backend 'ds720d' is version 1.0.1" /tmp/ds720d-loader.log
      - name: Keep Linux preview packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
