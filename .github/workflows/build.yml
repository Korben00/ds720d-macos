name: Build and software tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native executable
        run: make
      - name: Test packet framing and firmware transactions
        run: make test
      - name: Analyze native source
        run: make analyze
